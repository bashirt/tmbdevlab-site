<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TMB Dev Lab</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #0b0f19;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 700px;
      padding: 20px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 18px;
      color: #b0b0b0;
      line-height: 1.6;
    }

    .tag {
      display: inline-block;
      margin-top: 15px;
      padding: 6px 12px;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 12px;
      color: #888;
    }

    a {
      display: inline-block;
      margin-top: 25px;
      color: #4da3ff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>TMB Dev Lab</h1>

    <p>
      Building apps, tools, and experimental software for Apple and the web.
    </p>

    <div class="tag">Indie Developer Studio</div>

    <p>
      Small ideas. Clean design. Real products.
    </p>

    <a href="https://github.com/">View on GitHub</a>
  </div>
</body>
</html>
